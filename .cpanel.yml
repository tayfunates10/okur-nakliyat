---
# ==========================================================================
# Okur Nakliyat — cPanel Git Version Control otomatik dağıtım tanımı
#
# cPanel > Dosyalar > Git Version Control > Manage > "Pull or Deploy"
# ekranındaki "Deploy HEAD Commit" düğmesine basıldığında bu görevler çalışır.
#
# DEPLOYPATH değeri $HOME üzerinden çözülür; böylece cPanel kullanıcı adınız
# ne olursa olsun doğru dizine kopyalanır. Hesabınızda web kökü farklıysa
# (örneğin alt alan adı veya addon domain) aşağıdaki satırı değiştirin:
#   export DEPLOYPATH=$HOME/public_html/okurnakliyatedremit.com/
#
# NOT: Bu dosya şu an kullanılmıyor. Dağıtım GitHub Actions üzerinden yapılıyor
# (bkz. DEPLOY.md). cPanel Git ile dağıtım tercih edilirse, alan adının belge
# kökü /home/<kullanici>/public_html/okurnakliyatedremit.com/admin/public_html
# olduğu için DEPLOYPATH buna göre ayarlanmalıdır.
# ==========================================================================
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    - /bin/cp -Rf assets $DEPLOYPATH
