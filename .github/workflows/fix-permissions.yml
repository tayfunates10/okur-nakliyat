name: Sunucu izinlerini onar

# 403 Forbidden teşhisi ve onarımı.
# Yalnızca elle tetiklenir. Sunucudaki dosya izinlerini web sunucusunun
# okuyabileceği standart değerlere çeker: klasörler 755, dosyalar 644.
on:
  workflow_dispatch:
    inputs:
      htaccess:
        description: ".htaccess dosyasını ne yapsın?"
        required: true
        default: "dokunma"
        type: choice
        options:
          - dokunma
          - devre-disi-birak
          - geri-yukle

jobs:
  fix:
    name: public_html izinleri
    runs-on: ubuntu-latest

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LFTP_OPTS: "set ssl:verify-certificate no; set ftp:ssl-force true; set cmd:fail-exit no;"

    steps:
      - name: lftp kurulumu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mevcut izinler
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e \
            "$LFTP_OPTS ls -la public_html; ls -la public_html/assets; ls -la public_html/assets/css; bye"

      - name: Dizin ağacını çıkar
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e \
            "$LFTP_OPTS find -d 9 public_html/; bye" > tree.txt
          echo "--- bulunan girdi sayisi ---"
          wc -l < tree.txt

      - name: İzinleri düzelt (klasör 755, dosya 644)
        run: |
          # lftp find çıktısında klasörler / ile biter
          grep '/$'  tree.txt | sed 's#^\./##' > dirs.txt  || true
          grep -v '/$' tree.txt | sed 's#^\./##' > files.txt || true
          echo "klasor: $(wc -l < dirs.txt)  dosya: $(wc -l < files.txt)"

          {
            echo "set ssl:verify-certificate no"
            echo "set ftp:ssl-force true"
            echo "set cmd:fail-exit no"
            echo 'chmod 755 "public_html"'
            while IFS= read -r d; do
              [ -n "$d" ] && printf 'chmod 755 "%s"\n' "$d"
            done < dirs.txt
            while IFS= read -r f; do
              [ -n "$f" ] && printf 'chmod 644 "%s"\n' "$f"
            done < files.txt
            echo "bye"
          } > fix.lftp

          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -f fix.lftp

      - name: .htaccess durumu
        # 403'ün kaynağını elemek için .htaccess geçici olarak devre dışı
        # bırakılabilir veya geri yüklenebilir.
        if: ${{ inputs.htaccess != 'dokunma' }}
        run: |
          if [ "${{ inputs.htaccess }}" = "devre-disi-birak" ]; then
            echo "public_html/.htaccess -> .htaccess.bak"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e \
              "$LFTP_OPTS mv public_html/.htaccess public_html/.htaccess.bak; bye"
          else
            echo ".htaccess.bak -> .htaccess"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e \
              "$LFTP_OPTS mv public_html/.htaccess.bak public_html/.htaccess; bye"
          fi

      - name: Son durum
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e \
            "$LFTP_OPTS ls -la public_html; ls -la public_html/assets/css; bye"
