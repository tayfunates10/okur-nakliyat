name: Mobil CTA ve footer düzeltmesini üret

on:
  push:
    branches: [fix/mobil-cta-footer-bosluk]

permissions:
  contents: write

concurrency:
  group: mobil-cta-footer-duzelt
  cancel-in-progress: false

jobs:
  duzelt:
    runs-on: ubuntu-latest
    steps:
      - name: Özellik dalını al
        uses: actions/checkout@v4
        with:
          ref: fix/mobil-cta-footer-bosluk
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ortak mobil stil sorunlarını düzelt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          style = Path('assets/css/style.css')
          text = style.read_text(encoding='utf-8')

          old_gap = '''  /* Sabit çubuk hero'nun son düğmesinin üstüne biniyordu. Her sayfanın
             altına çubuk yüksekliği kadar boşluk bırakılır. */
          main {
            padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
          }'''
          new_gap = '''  /* Sabit iletişim çubuğunun güvenli alanı footer'ın alt boşluğunda
             korunur. main'e eklenen açık renkli boşluk CTA ile footer arasını
             kopardığı için burada ek alt alan oluşturulmaz. */
          main {
            padding-bottom: 0;
          }'''

          if text.count(old_gap) != 1:
              raise SystemExit(f'mobil main boşluk kuralı {text.count(old_gap)} kez bulundu; 1 olmalı')
          text = text.replace(old_gap, new_gap, 1)

          sentinel = '18. Koyu CTA okunurluluğu ve mobil footer birleşimi'
          if sentinel in text:
              raise SystemExit('CTA/footer düzeltme bloğu zaten mevcut')

          override = r'''

/* ==========================================================================
   18. Koyu CTA okunurluluğu ve mobil footer birleşimi
   --------------------------------------------------------------------------
   `.hizmet-bilgi` açık yüzey için yazılmıştır. Koyu bölümün doğrudan çocuğu
   olduğunda beyaz karta dönüşüp beyaz metin ve ikincil butonu görünmez
   bırakıyordu. Koyu bağlam burada geri yüklenir.
   ========================================================================== */

.section-dark > .hizmet-bilgi {
  color: var(--text-on-dark);
  background:
    radial-gradient(circle at 88% 12%, rgba(245, 196, 0, 0.09), transparent 32%),
    rgba(255, 255, 255, 0.045);
  border-color: var(--border-on-dark-strong);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
}

.section-dark > .hizmet-bilgi .section-title {
  color: var(--text-on-dark);
}

.section-dark > .hizmet-bilgi .hizmet-giris,
.section-dark > .hizmet-bilgi .hizmet-kapanis {
  color: var(--text-on-dark-muted);
}

.section-dark > .hizmet-bilgi .btn-secondary {
  --btn-bg: rgba(255, 255, 255, 0.07);
  --btn-color: var(--color-white);
  --btn-border: rgba(255, 255, 255, 0.34);
}

.section-dark > .hizmet-bilgi .btn-secondary:hover,
.section-dark > .hizmet-bilgi .btn-secondary:focus-visible {
  --btn-bg: rgba(255, 255, 255, 0.13);
  --btn-color: var(--color-white);
  --btn-border: var(--color-yellow);
}

@media (max-width: 720px) {
  /* Son içerik bölümü ve footer birbirinden kopuk görünmesin. Sabit iletişim
     çubuğu için gereken güvenli alan footer'ın kendi alt padding'inde kalır. */
  main > .section:last-child {
    padding-bottom: clamp(2.25rem, 8vw, 3rem);
  }

  main + .site-footer {
    padding-top: clamp(2.5rem, 8vw, 3.5rem);
  }

  .section-dark > .hizmet-bilgi {
    padding: clamp(1.35rem, 5vw, 1.75rem);
  }
}
'''

          style.write_text(text.rstrip() + override + '\n', encoding='utf-8')

          generator = Path('tools/sayfa.py')
          gtext = generator.read_text(encoding='utf-8')
          old_version = 'ONBELLEK_SURUMU = "33"'
          new_version = 'ONBELLEK_SURUMU = "34"'
          if gtext.count(old_version) != 1:
              raise SystemExit(f'önbellek sürümü {gtext.count(old_version)} kez bulundu; 1 olmalı')
          generator.write_text(gtext.replace(old_version, new_version, 1), encoding='utf-8')
          PY

      - name: On altı statik sayfayı yeniden üret
        run: |
          set -euo pipefail
          python3 tools/sayfa.py
          python3 tools/sayfa.py --kontrol

      - name: Mobil boşluk ve okunurluluk kurallarını doğrula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          style = Path('assets/css/style.css').read_text(encoding='utf-8')
          assert '18. Koyu CTA okunurluluğu ve mobil footer birleşimi' in style
          assert 'padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));' not in style
          assert 'main {\n    padding-bottom: 0;' in style
          assert '.section-dark > .hizmet-bilgi .btn-secondary' in style
          assert 'main + .site-footer' in style

          paths = [line.strip() for line in __import__('subprocess').check_output(
              ['python3', 'tools/sayfa.py', '--liste'], text=True
          ).splitlines() if line.strip()]
          assert len(paths) == 16, f'üretilen sayfa sayısı: {len(paths)}'

          for path in paths:
              html = Path(path).read_text(encoding='utf-8')
              assert '/assets/css/style.css?v=34' in html, f'{path}: stil sürümü 34 değil'
              assert '<main id="main">' in html, f'{path}: main yok'
              assert '<footer class="site-footer">' in html, f'{path}: footer yok'

          hakkimizda = Path('hakkimizda/index.html').read_text(encoding='utf-8')
          assert 'birlikte planlayalım.' in hakkimizda
          assert 'WhatsApp\'tan Yazın' in hakkimizda
          print('16 sayfada CTA okunurluluğu, mobil boşluk ve v34 bağlantısı doğrulandı.')
          PY

      - name: Düzeltmeyi özellik dalına işle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/css/style.css tools/sayfa.py
          while IFS= read -r sayfa; do
            git add -- "$sayfa"
          done < <(python3 tools/sayfa.py --liste)

          git rm -- .github/workflows/mobil-cta-footer-duzelt.yml docs/mobil-cta-footer-tetikle.md
          git diff --cached --check
          git status --short
          git commit -m "Mobil CTA okunurluluğunu ve footer boşluğunu düzelt"
          git push origin HEAD:fix/mobil-cta-footer-bosluk
