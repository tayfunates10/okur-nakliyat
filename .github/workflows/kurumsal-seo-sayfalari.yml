      - name: Tüm statik HTML sayfalarını üret
        run: python3 tools/sayfa.py

      - name: Kaynak ve çıktı tutarlılığını doğrula
        run: |
          set -euo pipefail
          python3 tools/sayfa.py --kontrol
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          beklenen = {
              "hakkimizda": "AboutPage",
              "iletisim": "ContactPage",
              "hizmet-bolgeleri": "CollectionPage",
          }
          for slug, tip in beklenen.items():
              source = Path(f"sayfalar/{slug}.html").read_text(encoding="utf-8")
              meta = re.match(r"\s*<!--json\s*(\{.*?\})\s*-->\s*", source, re.S)
              assert meta, f"{slug}: JSON başlığı yok"
              data = json.loads(meta.group(1))
              assert data["slug"] == slug
              assert data["sayfaTipi"] == tip

              output = Path(f"{slug}/index.html").read_text(encoding="utf-8")
              assert f'https://okurnakliyatedremit.com/{slug}/' in output
              assert '<meta name="robots" content="index, follow, max-image-preview:large">' in output
              assert 'Türkiye geneli asansörlü taşıma' not in output

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [n.text for n in root.findall("sm:url/sm:loc", ns)]
          assert len(urls) == 16, f"sitemap URL sayısı: {len(urls)}"
          for slug in beklenen:
              assert f"https://okurnakliyatedremit.com/{slug}/" in urls

          for path in [Path("index.html"), *Path(".").glob("*/index.html")]:
              html = path.read_text(encoding="utf-8")
              for href in ("/hakkimizda/", "/hizmet-bolgeleri/", "/iletisim/"):
                  assert href in html, f"{path}: {href} bağlantısı yok"

          print("16 sayfa, sitemap, kurumsal bağlantılar, canonical ve robots etiketleri doğrulandı.")
          PY

      - name: Değişiklikleri özellik dalına işle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            sablon/header.html \
            sablon/footer.html \
            sablon/taban.html \
            sayfalar/anasayfa.html \
            sayfalar/hakkimizda.html \
            sayfalar/iletisim.html \
            sayfalar/hizmet-bolgeleri.html \
            sitemap.xml \
            index.html

          while IFS= read -r sayfa; do
            git add -- "$sayfa"
          done < <(python3 tools/sayfa.py --liste)

          git rm -- .github/workflows/kurumsal-seo-sayfalari.yml
          git diff --cached --check
          git status --short
          git commit -m "Hakkımızda, iletişim ve hizmet bölgeleri sayfalarını ekle"
          git push origin HEAD:feat/kurumsal-seo-sayfalari
