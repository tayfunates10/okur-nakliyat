name: Kurumsal SEO sayfalarını hazırla

on:
  push:
    branches: [feat/kurumsal-seo-sayfalari]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurumsal-seo-sayfalari
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: feat/kurumsal-seo-sayfalari
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynak sayfaları ve bağlantıları hazırla
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def yaz(path: str, content: str) -> None:
              hedef = Path(path)
              hedef.parent.mkdir(parents=True, exist_ok=True)
              hedef.write_text(content.rstrip() + "\n", encoding="utf-8")

          def bir_kez_degistir(path: str, old: str, new: str) -> None:
              hedef = Path(path)
              text = hedef.read_text(encoding="utf-8")
              adet = text.count(old)
              if adet != 1:
                  raise SystemExit(f"{path}: beklenen parça {adet} kez bulundu; 1 olmalı")
              hedef.write_text(text.replace(old, new, 1), encoding="utf-8")

