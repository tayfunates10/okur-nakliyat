name: Minyatür tema çıktıları

on:
  push:
    branches:
      - feat/minyatur-iscilik-yeniden-tasarim
    paths:
      - 'assets/css/miniature-theme.css'
      - 'assets/css/footer-map.css'
      - 'tools/apply_miniature_theme.py'
      - '.github/workflows/apply-miniature-theme.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Üretim sürümünü güncelle ve sayfaları oluştur
        run: python3 tools/apply_miniature_theme.py

      - name: Değişiklikleri doğrula
        run: |
          python3 tools/sayfa.py --kontrol
          python3 - <<'PY'
          from pathlib import Path
          files = [
              p for p in Path('.').rglob('*.html')
              if '.git' not in p.parts
              and 'node_modules' not in p.parts
              and 'sablon' not in p.parts
              and 'sayfalar' not in p.parts
          ]
          missing = [
              str(p) for p in files
              if '/assets/css/footer-map.css?v=37' not in p.read_text(encoding='utf-8')
          ]
          if missing:
              raise SystemExit('v37 tema referansı eksik dosyalar: ' + ', '.join(missing))
          print(f'{len(files)} üretilmiş HTML dosyası doğrulandı.')
          PY

      - name: Üretim kaynağını ve statik çıktıları kaydet
        run: |
          if git diff --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/sayfa.py '*.html' */index.html
          git commit -m "Minyatür tema sürümünü üretim kaynağına uygula [skip ci]"
          git push
