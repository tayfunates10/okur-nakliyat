name: Kurumsal SEO özellik dalı üretim tanısı

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurumsal-seo-ozellik-dali
  cancel-in-progress: false

jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - name: Özellik dalını al
        uses: actions/checkout@v4
        with:
          ref: feat/kurumsal-seo-sayfalari
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Üretimi çalıştır ve sonucu dala yaz
        shell: bash
        run: |
          set +e
          mkdir -p docs
          {
            echo "Kurumsal SEO üretim tanısı"
            echo "Tarih: $(date -u +%FT%TZ)"
            echo
            python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/kurumsal-seo-sayfalari.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n      - name: Tüm statik HTML sayfalarını üret"
          print('başlangıç sayısı:', source.count(start))
          print('bitiş sayısı:', source.count(end))
          if start not in source or end not in source:
              raise SystemExit('Kurumsal SEO üretim bloğu bulunamadı')
          body = source.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          Path('/tmp/kurumsal-seo-uret.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('çıkarılan Python satırı:', len(lines))
          PY
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo
              echo "--- üretim betiği ---"
              python3 /tmp/kurumsal-seo-uret.py
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              echo
              echo "--- statik üretim ---"
              python3 tools/sayfa.py
              rc=$?
            fi
            echo
            echo "Çıkış kodu: $rc"
          } > docs/kurumsal-seo-uretim-tanisi.txt 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/kurumsal-seo-uretim-tanisi.txt
          git commit -m "Kurumsal SEO üretim tanısını kaydet" || true
          git push origin HEAD:feat/kurumsal-seo-sayfalari
