name: Mobil CTA ve footer düzeltmesini üret

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mobil-cta-footer-uretimi
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest

    steps:
      - name: Özellik dalını al
        uses: actions/checkout@v4
        with:
          ref: fix/mobil-cta-footer-bosluk
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Düzeltmeyi uygula ve sayfaları üret
        run: |
          set -euo pipefail
          python3 tools/mobil_cta_footer_fix.py
          python3 tools/sayfa.py
          python3 tools/sayfa.py --kontrol

      - name: On altı sayfayı doğrula
        run: |
          set -euo pipefail
          test "$(python3 tools/sayfa.py --liste | wc -l)" -eq 16
          grep -Fq '18. Koyu CTA okunurluluğu ve mobil footer birleşimi' assets/css/style.css
          ! grep -Fq 'padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));' assets/css/style.css
          grep -Fq 'ONBELLEK_SURUMU = "34"' tools/sayfa.py
          grep -Fq '/assets/css/style.css?v=34' hakkimizda/index.html
          grep -Fq "WhatsApp'tan Yazın" hakkimizda/index.html

          while IFS= read -r page; do
            grep -Fq '/assets/css/style.css?v=34' "$page"
            grep -Fq '<footer class="site-footer">' "$page"
          done < <(python3 tools/sayfa.py --liste)

      - name: Özellik dalına commit ve push yap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/css/style.css tools/sayfa.py
          while IFS= read -r page; do
            git add -- "$page"
          done < <(python3 tools/sayfa.py --liste)

          git rm -- tools/mobil_cta_footer_fix.py
          git diff --cached --check
          git status --short
          git commit -m "Mobil CTA okunurluluğunu ve footer boşluğunu düzelt"
          git push origin HEAD:fix/mobil-cta-footer-bosluk
