name: Hero başlığını kaynağa işle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hero başlığını değiştir
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sayfalar/anasayfa.html')
          text = path.read_text(encoding='utf-8')
          marker = '<h1 class="hero-title" id="heroTitle">'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Hero H1 başlangıcı bulunamadı.')
          end = text.find('</h1>', start)
          if end < 0:
              raise SystemExit('Hero H1 kapanışı bulunamadı.')
          end += len('</h1>')

          line_start = text.rfind('\n', 0, start) + 1
          indent = text[line_start:start]
          current = text[start:end]
          replacement = (
              '<h1 class="hero-title" id="heroTitle">\n'
              f'{indent}  <span class="hero-title-line"><span>Edremit’te <span class="hero-title-accent">güvenli ve planlı</span> nakliyat</span></span>\n'
              f'{indent}  <span class="hero-title-line"><span>Evinizi ve iş yerinizi özenle taşıyoruz.</span></span>\n'
              f'{indent}</h1>'
          )

          if current != replacement:
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Sayfayı üret ve doğrula
        run: |
          python3 tools/sayfa.py
          python3 tools/sayfa.py --kontrol
          grep -Fq 'Edremit’te <span class="hero-title-accent">güvenli ve planlı</span> nakliyat' index.html
          grep -Fq 'Evinizi ve iş yerinizi özenle taşıyoruz.' index.html
          ! grep -Fq 'Eşyalarınızı değil, güveninizi taşıyoruz.' index.html

      - name: Değişikliği ana dala işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sayfalar/anasayfa.html index.html
          if git diff --cached --quiet; then
            echo 'Değişiklik yok.'
            exit 0
          fi
          git commit -m 'Hero başlığını daha anlamlı hale getir'
          git push origin HEAD:main
