name: Yayına al (FTP)

# `main` dalına her push sonrası site otomatik güncellenir.
# Actions sekmesinden "Run workflow" ile elle de tetiklenebilir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: okurnakliyatedremit.com
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sayfaları üret
        # sablon/ + sayfalar/ -> index.html ve <slug>/index.html.
        # Üretilenler depoya da işlenir; burada yeniden üretilmesi, depodaki
        # sürümün şablonla tutarlı olduğunu garanti eder.
        run: python3 tools/sayfa.py

      - name: Yayın klasörünü hazırla
        # Sunucuya yalnızca sitenin çalışması için gereken dosyalar gider.
        # README.md, DEPLOY.md, .cpanel.yml, sablon/, sayfalar/, tools/,
        # galeri-kaynak/ ve .github/ yüklenmez.
        run: |
          set -euo pipefail
          mkdir -p dist
          cp 404.html dist/
          # Kopyalanacak sayfaları üretecinin kendisi söyler. Slug listesinden
          # türetiliyordu; galeri sayfası fotoğraf yokken hiç üretilmediği için
          # `cp` düşüyor ve dağıtım FTP adımına gelmeden ölüyordu.
          python3 tools/sayfa.py --liste | while read -r sayfa; do
            if [ ! -f "$sayfa" ]; then
              echo "üretilmesi gereken dosya yok: $sayfa" >&2
              exit 1
            fi
            mkdir -p "dist/$(dirname "$sayfa")"
            cp "$sayfa" "dist/$sayfa"
          done
          cp robots.txt dist/
          cp sitemap.xml dist/
          cp .htaccess dist/
          cp -R assets dist/
          find dist -name '.gitkeep' -delete
          echo "--- yüklenecek dosyalar ---"
          find dist -type f | sort

      # `Timeout (control socket)` üç kez görüldü: bağlantı hiç kurulamıyor,
      # tek bayt bile aktarılmıyor. Bir kez kendiliğinden geçti, bir kez
      # arka arkaya iki denemede de düştü. Yükleme baştan idempotent
      # olduğu için otomatik ikinci bir deneme yapılıyor; yine düşerse
      # sorun sunucu tarafında demektir ve iş kırmızı biter.
      - name: FTP ile sunucuya yükle
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # GoDaddy açık FTPS destekler. Bağlantı hatası alırsanız burayı
          # protocol: ftp olarak değiştirin.
          protocol: ftps
          local-dir: ./dist/
          # Bu FTP hesabı /home/locqyjadry1t/public_html/okurnakliyatedremit.com/admin
          # klasörüne kilitlidir; oturum açıldığında gördüğü "public_html" aslında
          # .../admin/public_html dizinidir.
          #
          # Alan adının belge kökü cPanel > Domains üzerinden tam olarak bu dizine
          # ayarlandığı için hedef "public_html/" olarak kalır. Belge kökü ileride
          # değiştirilirse bu satır da güncellenmelidir.
          server-dir: public_html/
          # Yalnızca değişen dosyalar yüklenir (durum dosyası sunucuda tutulur).
          state-name: .ftp-deploy-state.json
          dry-run: false
          # Varsayılan 30sn. Sunucu yoğunken el sıkışma bu süreye sığmıyor
          # olabilir; uzatmak yalnızca beklemeyi artırır, risk getirmez.
          timeout: 60000

      - name: İlk deneme düştüyse bekle
        if: steps.ftp.outcome == 'failure'
        run: |
          echo "FTP ilk denemesi başarısız. 60 saniye bekleyip tekrar denenecek."
          sleep 60

      - name: FTP ile sunucuya yükle (ikinci deneme)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: public_html/
          state-name: .ftp-deploy-state.json
          dry-run: false
          timeout: 60000

      # HTTP yanıtı barındırma önbelleği veya bot filtresi nedeniyle zaman
      # zaman eski/farklı HTML döndürebiliyor. Esas doğrulama, az önce yazılan
      # FTPS hedefinden kritik dosyaları geri indirip yerel yayın paketiyle
      # byte-byte karşılaştırır.
      - name: Sunucudaki footer dosyalarını doğrula
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 tools/yayin-dogrula.py

      # Ek tanı: ziyaretçiye açık HTTP yanıtında da yeni HTML/CSS görünüyorsa
      # kayda geçirir. Bazı GitHub runner IP'lerinde barındırma katmanı eski
      # veya farklı HTML döndürdüğünden bu adım dağıtımı kırmaz; esas kanıt
      # yukarıdaki FTPS byte karşılaştırmasıdır.
      - name: HTTP canlı yanıtını tanıla
        continue-on-error: true
        run: |
          set -euo pipefail
          html_url="https://okurnakliyatedremit.com/?deploy=${GITHUB_SHA}"
          css_ref="$(grep -oE '/assets/css/footer-contact\.css\?v=[0-9]+' dist/index.html | head -n 1)"

          html="$(curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 30 \
            -H 'Cache-Control: no-cache' "$html_url")"
          css="$(curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "https://okurnakliyatedremit.com${css_ref}&deploy=${GITHUB_SHA}")"

          if grep -Fq 'M22 16.92v3' <<<"$html" && \
             grep -Fq 'M20 10c0 5-8 12' <<<"$html" && \
             grep -Fq "$css_ref" <<<"$html" && \
             grep -Fq 'grid-template-columns: 42px minmax(0, 1fr);' <<<"$css" && \
             grep -Fq 'grid-template-columns: repeat(2, minmax(0, 1fr));' <<<"$css"; then
            echo "Genel HTTP uç noktasında yeni footer iletişim HTML ve CSS'i doğrulandı."
            exit 0
          fi

          echo "::warning::HTTP katmanı güncel footer dosyalarını henüz döndürmedi; FTPS hedefindeki dosyalar birebir doğrulandı."
          exit 1

      - name: Dağıtım sonucunu commit'e yaz
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="FTP yüklemesi ve sunucu dosya doğrulaması başarılı"
          else
            STATE="failure"
            DESCRIPTION="FTP yüklemesi veya sunucu dosya doğrulaması başarısız"
          fi

          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/deploy-status.json
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "description": os.environ["DESCRIPTION"],
              "context": "deploy/ftp-live",
          }))
          PY

          for deneme in 1 2 3; do
            if curl --fail --silent --show-error --location \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/deploy-status.json; then
              exit 0
            fi
            sleep 5
          done

          echo "::error::Dağıtım commit durumu GitHub API'ye yazılamadı."
          exit 1
