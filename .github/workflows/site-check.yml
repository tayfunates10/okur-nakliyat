name: Mobil CTA PR üretimi

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: mobil-cta-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  uret-ve-dogrula:
    if: github.event.pull_request.head.ref == 'fix/mobil-cta-footer-bosluk'
    runs-on: ubuntu-latest

    steps:
      - name: PR dalını al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Düzeltmeyi üret veya mevcut çıktıyı doğrula
        run: |
          set -euo pipefail

          if [ -f tools/mobil_cta_footer_fix.py ]; then
            python3 tools/mobil_cta_footer_fix.py
            python3 tools/sayfa.py
          fi

          python3 tools/sayfa.py --kontrol
          test "$(python3 tools/sayfa.py --liste | wc -l)" -eq 16
          grep -Fq '18. Koyu CTA okunurluluğu ve mobil footer birleşimi' assets/css/style.css
          ! grep -Fq 'padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));' assets/css/style.css
          grep -Fq 'ONBELLEK_SURUMU = "34"' tools/sayfa.py
          grep -Fq '/assets/css/style.css?v=34' hakkimizda/index.html
          grep -Fq "WhatsApp'tan Yazın" hakkimizda/index.html

          while IFS= read -r page; do
            grep -Fq '/assets/css/style.css?v=34' "$page"
            grep -Fq '<footer class="site-footer">' "$page"
          done < <(python3 tools/sayfa.py --liste)

      - name: Üretilen değişikliği PR dalına yaz
        if: hashFiles('tools/mobil_cta_footer_fix.py') != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/css/style.css tools/sayfa.py
          while IFS= read -r page; do
            git add -- "$page"
          done < <(python3 tools/sayfa.py --liste)

          git rm -- tools/mobil_cta_footer_fix.py
          git diff --cached --check
          git status --short
          git commit -m "Mobil CTA okunurluluğunu ve footer boşluğunu düzelt"
          git push origin HEAD:${GITHUB_HEAD_REF}
