name: Site kontrolü

# Yayındaki siteyi dışarıdan denetler: SSL, HTTP durumları, kritik
# dosyaların erişilebilirliği, .htaccess kaynaklı yanıt başlıkları ve
# sayfanın gerçekten render edilip edilmediği.
#
# Yalnızca elle tetiklenir ve siteye hiçbir değişiklik yazmaz.
on:
  workflow_dispatch:

jobs:
  check:
    name: okurnakliyatedremit.com denetimi
    runs-on: ubuntu-latest

    env:
      SITE: okurnakliyatedremit.com

    steps:
      - name: DNS ve SSL
        run: |
          echo "=== DNS ==="
          getent hosts "$SITE" || echo "cozulemedi"

          echo
          echo "=== HTTPS (sertifika dogrulamali) ==="
          # ssl_verify_result: 0 = gecerli sertifika
          curl -sS -o /dev/null \
            -w "http=%{http_code} ssl_verify=%{ssl_verify_result} redirect=%{redirect_url}\n" \
            --max-time 25 "https://$SITE/" || echo "HTTPS BAGLANTISI KURULAMADI"

          echo
          echo "=== Sertifika suresi ==="
          echo | openssl s_client -servername "$SITE" -connect "$SITE:443" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null \
            || echo "SERTIFIKA OKUNAMADI"

          echo
          echo "=== HTTP -> HTTPS yonlendirmesi ==="
          curl -sS -o /dev/null \
            -w "http=%{http_code} redirect=%{redirect_url}\n" \
            --max-time 25 "http://$SITE/" || echo "HTTP BAGLANTISI KURULAMADI"

      - name: Kritik dosyalar
        run: |
          for path in "/" \
                      "/assets/css/style.css" \
                      "/assets/css/variables.css" \
                      "/assets/js/main.js" \
                      "/assets/images/hero/okur-nakliyat-hero-background.webp" \
                      "/assets/images/hero/okur-nakliyat-hero.svg" \
                      "/assets/images/logo/favicon.svg"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -L "https://$SITE$path" || echo "---")
            printf "%-58s %s\n" "$path" "$code"
          done

      - name: Yanıt başlıkları (.htaccess doğrulaması)
        run: |
          echo "=== index.html ==="
          curl -sS -I -L --max-time 20 "https://$SITE/" \
            | grep -iE "^(HTTP/|content-type|cache-control|x-content-type-options|referrer-policy|x-frame-options)" \
            || echo "baslik okunamadi"

          echo
          echo "=== style.css (sikistirma + onbellek) ==="
          curl -sS -I -L --compressed --max-time 20 "https://$SITE/assets/css/style.css" \
            | grep -iE "^(HTTP/|content-type|cache-control|content-encoding)" \
            || echo "baslik okunamadi"

      - name: Sayfa gerçekten render ediliyor mu
        run: |
          curl -sS -L --max-time 25 "https://$SITE/" -o page.html || true
          echo "boyut: $(wc -c < page.html) bayt"
          echo

          fail=0
          for needle in "<html lang=\"tr\">" \
                        "Okur Nakliyat | Edremit" \
                        "hero-title" \
                        "okur-nakliyat-hero-background.webp" \
                        "wa.me/905372265043" \
                        "tel:+905372265043"; do
            if grep -qF "$needle" page.html; then
              printf "OK    %s\n" "$needle"
            else
              printf "EKSIK %s\n" "$needle"
              fail=1
            fi
          done

          echo
          if [ "$fail" -eq 0 ]; then
            echo ">>> SONUC: Sayfa beklendigi gibi yayinda."
          else
            echo ">>> SONUC: Sayfa beklenen icerigi tam dondurmedi."
            exit 1
          fi
