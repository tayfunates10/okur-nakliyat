name: SEO site geneli son QA

on:
  push:
    branches:
      - seo/guvenli-site-iyilestirmeleri

permissions:
  contents: read
  statuses: write

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: QA durumunu başlat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
            "state": "pending",
            "context": "qa/seo-site",
            "description": "Lazy-load uyumlu responsive QA çalışıyor",
            "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Sunucuyu başlat
        run: |
          python3 -m http.server 8099 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8099/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/server.log
          exit 1

      - name: 13 sayfada 78 responsive tarayıcı senaryosu
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const paths = [
            '/', '/asansorlu-nakliyat/', '/evden-eve-nakliyat/',
            '/sehirler-arasi-nakliyat/', '/ofis-tasima/',
            '/parca-esya-tasima/', '/paketleme-hizmeti/',
            '/kurulum-montaj/', '/nakliyat-fiyatlari/',
            '/sikca-sorulan-sorular/', '/galeri/',
            '/kvkk-aydinlatma-metni/', '/gizlilik-politikasi/'
          ];
          const viewports = [
            { width: 320, height: 568 }, { width: 390, height: 844 },
            { width: 768, height: 1024 }, { width: 844, height: 390 },
            { width: 1366, height: 768 }, { width: 1920, height: 1080 }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];

            for (const path of paths) {
              for (const viewport of viewports) {
                const page = await browser.newPage({ viewport });
                const label = `${path} ${viewport.width}x${viewport.height}`;
                const consoleErrors = [];
                const requestErrors = [];
                page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
                page.on('pageerror', err => consoleErrors.push(err.message));
                page.on('requestfailed', req => {
                  if (req.url().startsWith('http://127.0.0.1:8099/')) {
                    requestErrors.push(`${req.url()}: ${req.failure()?.errorText || 'failed'}`);
                  }
                });

                const response = await page.goto(`http://127.0.0.1:8099${path}`, {
                  waitUntil: 'networkidle', timeout: 30000
                });
                if (!response || response.status() !== 200) {
                  failures.push(`${label}: HTTP ${response?.status() || 'yanıt yok'}`);
                }

                await page.evaluate(async () => {
                  for (let y = 0; y < document.body.scrollHeight; y += Math.max(300, innerHeight * 0.8)) {
                    scrollTo(0, y);
                    await new Promise(resolve => setTimeout(resolve, 35));
                  }
                  scrollTo(0, 0);
                });
                await page.waitForTimeout(250);

                const result = await page.evaluate(() => {
                  const ids = [...document.querySelectorAll('[id]')].map(el => el.id);
                  return {
                    scrollWidth: document.documentElement.scrollWidth,
                    clientWidth: document.documentElement.clientWidth,
                    h1: document.querySelectorAll('h1').length,
                    duplicateIds: [...new Set(ids.filter((id, i) => ids.indexOf(id) !== i))],
                    brokenImages: [...document.images]
                      .filter(img => img.currentSrc && img.complete && img.naturalWidth === 0)
                      .map(img => img.currentSrc),
                    canonical: document.querySelector('link[rel="canonical"]')?.href || ''
                  };
                });

                if (result.scrollWidth > result.clientWidth + 1) failures.push(`${label}: yatay taşma ${result.scrollWidth}/${result.clientWidth}`);
                if (result.h1 !== 1) failures.push(`${label}: H1 sayısı ${result.h1}`);
                if (result.duplicateIds.length) failures.push(`${label}: yinelenen ID ${result.duplicateIds.join(',')}`);
                if (result.brokenImages.length) failures.push(`${label}: kırık görsel ${result.brokenImages.join(',')}`);
                if (!result.canonical.startsWith('https://okurnakliyatedremit.com/')) failures.push(`${label}: canonical ${result.canonical}`);
                if (consoleErrors.length) failures.push(`${label}: console ${consoleErrors.join(' | ')}`);
                if (requestErrors.length) failures.push(`${label}: istek ${requestErrors.join(' | ')}`);
                await page.close();
              }
            }

            await browser.close();
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
            console.log(`${paths.length} sayfa × ${viewports.length} görünüm = ${paths.length * viewports.length} test geçti.`);
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: QA sonucunu kaydet
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY' > /tmp/status-final.json
          import json, os
          success = os.environ['JOB_STATUS'] == 'success'
          print(json.dumps({
            "state": "success" if success else "failure",
            "context": "qa/seo-site",
            "description": "13 sayfa ve 78 responsive senaryo başarılı" if success else "Responsive QA düzeltme gerektiriyor",
            "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status-final.json
