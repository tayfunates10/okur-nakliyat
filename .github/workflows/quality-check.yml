name: GA4 ve dönüşüm takibi üretimi

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ga4-uret-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  produce:
    name: GA4 çıktısını üret ve doğrula
    if: github.event.pull_request.head.ref == 'feat/ga4-donusum-takibi'
    runs-on: ubuntu-latest

    steps:
      - name: PR dalını al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: GA4, izin yönetimi ve dönüşüm olaylarını üret
        run: |
          set -euo pipefail
          python3 tools/ga4_betik_onar.py
          python3 -m py_compile tools/ga4_kurulum.py
          python3 tools/ga4_kurulum.py
          python3 tools/sayfa.py

      - name: Kaynak ve çıktı bütünlüğünü doğrula
        run: |
          set -euo pipefail
          python3 tools/sayfa.py --kontrol
          test "$(python3 tools/sayfa.py --liste | wc -l)" -eq 16
          node --check assets/js/main.js

          grep -Fq 'G-DPRPQ2YL2E' sablon/taban.html
          grep -Fq 'analytics_storage: "denied"' sablon/taban.html
          grep -Fq 'id="analyticsConsent"' sablon/taban.html
          grep -Fq 'phone_click' assets/js/main.js
          grep -Fq 'whatsapp_click' assets/js/main.js
          grep -Fq 'directions_click' assets/js/main.js
          grep -Fq 'quote_submit' assets/js/main.js
          grep -Fq 'ONBELLEK_SURUMU = "36"' tools/sayfa.py
          grep -Fq 'Google Analytics 4' sayfalar/gizlilik-politikasi.html
          ! grep -Fq 'ad_storage: "granted"' sablon/taban.html
          ! grep -Fq 'name: value("name")' assets/js/main.js
          ! grep -Fq 'phone: value("phone")' assets/js/main.js

          while IFS= read -r page; do
            grep -Fq 'G-DPRPQ2YL2E' "$page"
            grep -Fq 'id="analyticsConsent"' "$page"
            grep -Fq '/assets/js/main.js?v=36' "$page"
          done < <(python3 tools/sayfa.py --liste)

      - name: Üretilen dosyaları PR dalına yaz
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            sablon/taban.html \
            assets/js/main.js \
            assets/css/style.css \
            sayfalar/gizlilik-politikasi.html \
            tools/sayfa.py

          while IFS= read -r page; do
            git add -- "$page"
          done < <(python3 tools/sayfa.py --liste)

          git checkout origin/main -- .github/workflows/quality-check.yml
          git add -- .github/workflows/quality-check.yml
          git rm -- tools/ga4_kurulum.py tools/ga4_betik_onar.py

          git diff --cached --check
          git status --short
          git commit -m "GA4 ve izinli dönüşüm takibini kur"
          git push origin HEAD:${GITHUB_HEAD_REF}
