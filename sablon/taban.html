  <!--
    Google Fonts stil sayfası render'ı bloklamaz. Blokladığında, servis
    yavaşlarsa veya erişilemezse sayfa tamamen boş kalıyordu (ölçüldü: 13 sn).
    media="print" ile indirilir, yüklenince "all" yapılır; yazı tipi gelene
    kadar --font-body / --font-heading yedekleri (Segoe UI, system-ui)
    kullanılır.
  -->
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
  </noscript>

  <link rel="preload" href="/assets/images/hero/okur-nakliyat-hero-background.webp?v={{v}}"
        as="image" type="image/webp" fetchpriority="high">

  <!--
    ÖNEMLİ: .htaccess her .css/.js/.webp/.svg/.jpg dosyasına
    `max-age=31536000, immutable` veriyor. `immutable`, tarayıcıya "bu URL'i
    bir daha doğrulama" demek; dosyanın içeriği değişse bile aynı URL eski
    sürümü göstermeye devam eder.

    Bu yüzden **önbelleklenen her varlık** — stil, betik ve görseller —
    aynı `?v=` numarasını taşır. Herhangi biri değiştiğinde numara artırılır;
    tek yerden bakıldığı için unutulması zorlaşır.

    Bu kural bir kez ihlal edildi: hizmet bölgesi haritası yeniden çizildi
    ama dosya adı ve URL'i aynı kaldığı için ziyaretçilerde eski harita
    görünmeye devam etti.
  -->
  <link rel="stylesheet" href="/assets/css/reset.css?v={{v}}">
  <link rel="stylesheet" href="/assets/css/variables.css?v={{v}}">
  <link rel="stylesheet" href="/assets/css/components.css?v={{v}}">
  <link rel="stylesheet" href="/assets/css/style.css?v={{v}}">
