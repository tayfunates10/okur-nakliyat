<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sayfa Bulunamadı | Okur Nakliyat</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0B0B0B">
  <link rel="icon" href="/assets/images/logo/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --yellow: #f5c400;
      --black: #0b0b0b;
      --white: #fff;
      --muted: rgba(255,255,255,.68);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      /* viewport-fit=cover altında çentik ve ev göstergesi payı eklenir. */
      padding:
        calc(24px + env(safe-area-inset-top, 0px))
        max(24px, env(safe-area-inset-right, 0px))
        calc(24px + env(safe-area-inset-bottom, 0px))
        max(24px, env(safe-area-inset-left, 0px));
      font-family: Inter, system-ui, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 70% 30%, rgba(245,196,0,.15), transparent 28%),
        linear-gradient(145deg, #070707, #151515);
    }
    main {
      width: min(100%, 720px);
      text-align: center;
    }
    .code {
      display: block;
      /* Yatay tutulan telefonda 24vw sayıyı ekrandan taşırıyordu; yükseklik de
         hesaba katılır. */
      font: 800 clamp(4rem, min(24vw, 26vh), 13rem)/.85 Manrope, system-ui, sans-serif;
      letter-spacing: -.08em;
      color: var(--yellow);
    }
    h1 {
      margin: clamp(12px, 3vh, 28px) 0 12px;
      font: 800 clamp(1.75rem, min(7vw, 9vh), 4rem)/1 Manrope, system-ui, sans-serif;
      letter-spacing: -.04em;
    }
    p {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.7;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: clamp(16px, 3.5vh, 28px);
      padding: 0 24px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      color: var(--black);
      background: var(--yellow);
    }
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>Bu sayfa taşınmış olabilir.</h1>
    <p>Aradığınız sayfa bulunamadı. Ana sayfaya dönerek Okur Nakliyat hizmetlerini inceleyebilir veya bizimle iletişime geçebilirsiniz.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
