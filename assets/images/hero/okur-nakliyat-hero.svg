<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="none">
  <title>Okur Nakliyat nakliye aracı illüstrasyonu</title>
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="176" x2="0" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4DE"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="600" y1="270" x2="700" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD94A"/>
      <stop offset="1" stop-color="#F5C400"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="614" y1="286" x2="700" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33465A"/>
      <stop offset="1" stop-color="#18232F"/>
    </linearGradient>
    <radialGradient id="lightGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset="1" stop-color="#FFD94A"/>
    </radialGradient>
    <filter id="softShadow" x="-25%" y="-120%" width="150%" height="340%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="boxClip">
      <rect x="150" y="176" width="450" height="286" rx="18"/>
    </clipPath>
  </defs>

  <!-- Hareket çizgileri -->
  <g>
    <rect x="44" y="234" width="92" height="8" rx="4" fill="#F5C400" opacity="0.45"/>
    <rect x="20" y="300" width="64" height="8" rx="4" fill="#F5C400" opacity="0.28"/>
    <rect x="58" y="366" width="40" height="8" rx="4" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- Zemin çizgisi -->
  <path d="M80 570 H880" stroke="#E7E7E2" stroke-opacity="0.16" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="26 20"/>

  <!-- Yumuşak yer gölgesi -->
  <ellipse cx="500" cy="582" rx="330" ry="20" fill="#000000" opacity="0.5" filter="url(#softShadow)"/>

  <!-- Araç -->
  <g>
    <!-- Şasi -->
    <rect x="150" y="462" width="662" height="32" rx="8" fill="#0B0B0B"/>

    <!-- Kasa -->
    <g clip-path="url(#boxClip)">
      <rect x="150" y="176" width="450" height="286" fill="url(#boxGrad)"/>
      <!-- Panel dikişleri -->
      <path d="M300 176 V398 M452 176 V398" stroke="#0B0B0B" stroke-opacity="0.07" stroke-width="2"/>
      <!-- Arka kapak kenarı -->
      <rect x="150" y="176" width="18" height="286" fill="#0B0B0B" opacity="0.06"/>
      <!-- Sarı vurgu şeridi -->
      <rect x="150" y="398" width="450" height="18" fill="#F5C400"/>
      <!-- Koyu alt bant -->
      <rect x="150" y="416" width="450" height="46" fill="#222222"/>

      <!-- Kasa üzerindeki marka işareti: sarı halka + rota noktası -->
      <path d="M314.5 277.6 A42 42 0 1 1 289.4 252.5" stroke="#F5C400" stroke-width="12"
            stroke-linecap="round" fill="none"/>
      <circle cx="304.7" cy="262.3" r="8" fill="#F5C400"/>
      <!-- Soyut kelime işareti -->
      <rect x="340" y="276" width="190" height="18" rx="9" fill="#0B0B0B" opacity="0.14"/>
      <rect x="340" y="306" width="118" height="12" rx="6" fill="#0B0B0B" opacity="0.09"/>
    </g>
    <rect x="150" y="176" width="450" height="286" rx="18" stroke="#0B0B0B" stroke-opacity="0.08"/>

    <!-- Kabin -->
    <path d="M600 270 H744 C766 270 782 282 789 303 L806 392 C812 410 814 428 814 444 V462 H600 Z"
          fill="url(#cabGrad)"/>
    <!-- Kapı hattı -->
    <rect x="608" y="282" width="98" height="172" rx="10" stroke="#0B0B0B" stroke-opacity="0.16" fill="none"/>
    <rect x="628" y="392" width="32" height="8" rx="4" fill="#0B0B0B" opacity="0.4"/>
    <!-- Yan cam -->
    <rect x="616" y="290" width="82" height="72" rx="8" fill="url(#glassGrad)"/>
    <!-- Ön cam -->
    <path d="M712 290 H746 C762 290 772 300 776 314 L792 362 H712 Z" fill="url(#glassGrad)"/>
    <path d="M726 296 L744 356" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="8" stroke-linecap="round"/>
    <!-- Ayna -->
    <path d="M792 300 H802" stroke="#151515" stroke-width="4" stroke-linecap="round"/>
    <rect x="800" y="286" width="10" height="28" rx="4" fill="#151515"/>
    <!-- Far ve tampon -->
    <rect x="794" y="404" width="24" height="18" rx="7" fill="url(#lightGrad)"/>
    <rect x="786" y="430" width="36" height="34" rx="10" fill="#151515"/>
  </g>

  <!-- Tekerlekler -->
  <g>
    <g transform="translate(300 518)">
      <circle r="52" fill="#121212"/>
      <circle r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
      <circle r="40" fill="#1C1C1C"/>
      <circle r="26" fill="#E7E7E2"/>
      <circle r="9" fill="#F5C400"/>
    </g>
    <g transform="translate(716 518)">
      <circle r="52" fill="#121212"/>
      <circle r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
      <circle r="40" fill="#1C1C1C"/>
      <circle r="26" fill="#E7E7E2"/>
      <circle r="9" fill="#F5C400"/>
    </g>
  </g>
</svg>
